function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function explain(t){let x=t.toLowerCase();
if(x.includes('percentage')||x.includes('प्रतिशत'))return 'प्रतिशत का अर्थ है सौ में से हिस्सा। उदाहरण: 200 का 10 प्रतिशत निकालने के लिए 200 गुणा 10 करके 100 से भाग दें। उत्तर 20 है।';
if(x.includes('photosynthesis')||x.includes('प्रकाश संश्लेषण'))return 'प्रकाश संश्लेषण वह प्रक्रिया है जिसमें हरे पौधे सूर्य के प्रकाश की सहायता से पानी और कार्बन डाइऑक्साइड से भोजन बनाते हैं और ऑक्सीजन छोड़ते हैं।';
if(x.includes('average')||x.includes('औसत'))return 'औसत निकालने के लिए सभी संख्याओं को जोड़कर कुल संख्याओं की गिनती से भाग देते हैं। उदाहरण: 2, 4, 6 का औसत 4 है।';
if(x.includes('भारत')||x.includes('india'))return 'भारत दक्षिण एशिया में स्थित है। इसकी राजधानी नई दिल्ली है। भारत का संविधान 26 जनवरी 1950 को लागू हुआ।';
return 'इस विषय को समझने के लिए पहले इसकी परिभाषा पढ़ें, फिर उदाहरण देखें और अभ्यास करें। यह Demo अभी हर विषय का पूरा AI उत्तर नहीं बना सकता। आप इस विषय की वीडियो क्लास भी खोज सकते हैं।';}

["Big का comparative?","Biger|Biggest|Bigger|More big",2,"Bigger."],
["I ___ a student.","is|am|are|be",1,"I के साथ am आता है।"],
["They ___ playing.","is|am|are|was",2,"They के साथ are आता है।"],
["Mouse का plural?","Mouses|Mice|Mices|Mouse",1,"Mice."],
["Beautiful का अर्थ?","सुंदर|कठिन|तेज|बुरा",0,"Beautiful का अर्थ सुंदर है।"],
["Begin का समानार्थी?","End|Start|Stop|Close",1,"Start का अर्थ शुरू करना है।"],
["Early का विलोम?","Soon|Late|Fast|Quick",1,"Late."],
["She ___ to school daily.","go|going|goes|gone",2,"She के साथ goes आता है।"],
["Man का plural?","Mans|Men|Manses|Man",1,"Men."],
["Honest से पहले कौन-सा article?","A|An|The only|No article",1,"Honest में h silent है, इसलिए An।"],
["Slowly का अर्थ?","तेजी से|धीरे-धीरे|ऊपर|नीचे",1,"धीरे-धीरे।"],
["Write का past tense?","Writed|Written|Wrote|Writing",2,"Wrote."],
["Kind का अर्थ?","दयालु|क्रोधित|कमजोर|धीमा",0,"Kind का अर्थ दयालु है।"],
["Ram plays cricket. इसमें noun?","Plays|Ram|The|None",1,"Ram व्यक्ति का नाम है, इसलिए noun है।"]
];
const questions=raw.map(x=>({q:x[0],o:x[1].split('|'),a:x[2],w:x[3]}));
function startQuiz(){clearInterval(timer);app.innerHTML=`<div class="card"><h2>Mock Test Settings / परीक्षा सेटिंग</h2><p>परीक्षा चुनें:</p><select id="exam"><option>SSC CGL</option><option>SSC CHSL</option><option>SSC MTS</option><option>SSC GD</option><option>Railway NTPC</option><option>Railway Group D</option><option>Banking</option></select><p>प्रश्नों की संख्या:</p><select id="questionCount"><option value="10">10 Questions</option><option value="25">25 Questions</option><option value="50">50 Questions</option><option value="100">100 Questions</option></select><p class="small">हर प्रश्न के लिए 1 मिनट। गलत उत्तर पर कोई negative marking नहीं।</p><button onclick="beginQuiz()">Start Test</button><button class="back" onclick="home()">⬅ Home</button></div>`;}
function beginQuiz(){clearInterval(timer);selectedExam=document.getElementById('exam').value;testCount=Number(document.getElementById('questionCount').value);testQuestions=[...questions].sort(()=>Math.random()-.5).slice(0,testCount);current=0;points=0;time=testCount*60;showQuestion();timer=setInterval(()=>{time--;let e=document.getElementById('timer');if(e)e.textContent='समय / Time: '+Math.floor(time/60)+':'+String(time%60).padStart(2,'0');if(time<=0)finishQuiz();},1000);}
function showQuestion(){answered=false;let q=testQuestions[current];app.innerHTML=`<div class="card"><b>${selectedExam} Mock Test</b><p id="timer">समय / Time: ${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}</p><p>Question ${current+1} of ${testCount}</p><h2>${q.q}</h2>${q.o.map((x,i)=>`<button class="option" onclick="checkAnswer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<p id="feedback"></p><button id="next" onclick="nextQuestion()" style="display:none">Next / अगला</button></div>`;}
function checkAnswer(i){if(answered)return;answered=true;let q=testQuestions[current];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('correct');if(n===i&&i!==q.a)b.classList.add('wrong');});if(i===q.a)points++;document.getElementById('feedback').innerHTML=(i===q.a?'✅ सही उत्तर':'❌ गलत उत्तर')+'<br><b>व्याख्या:</b> '+q.w;document.getElementById('next').style.display='inline-block';}
function nextQuestion(){current++;if(current<testQuestions.length)showQuestion();else finishQuiz();}
function finishQuiz(){clearInterval(timer);let p=Math.round(points/testCount*100);app.innerHTML=`<div class="card"><h2>परीक्षा पूरी हुई / Test Completed!</h2><h1>${points} / ${testCount}</h1><h2>${p}%</h2><p>सही उत्तर: ${points}</p><p>गलत या छोड़े गए: ${testCount-points}</p><p>${p>=80?'बहुत अच्छा!':p>=50?'अच्छा प्रयास!':'अभ्यास जारी रखें!'}</p><button onclick="startQuiz()">Try Again</button><button class="back" onclick="home()">Home</button></div>`;}
home();
</script>
</body>
</html>
